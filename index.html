<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Task Tree</title>

        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <!-- DRAWER -->
        <aside id="drawer" class="drawer">
            <div class="drawer-header">
                <h2>Folders</h2>
            </div>

            <div id="folderList" class="folder-list"></div>

            <button id="addFolder" class="primary">
                <span id="addFolderIcon"></span>
                + New Folder
            </button>
        </aside>

        <div id="drawerOverlay" class="drawer-overlay"></div>

        <header class="topbar">
            <button id="drawerToggle" type="button" aria-label="Open folders">
                ☰
            </button>

            <div>
                <h1>Task Tree</h1>
                <div id="status">Saved</div>
            </div>

            <button id="addRoot" class="primary">
                <span id="addRootIcon"></span>
                +Task
            </button>
        </header>

        <main id="tree"></main>

        <div id="empty" class="empty">
            <div>No tasks yet</div>

            <button id="emptyAdd" class="primary">
                <span id="emptyAddIcon"></span>
                Add your first task
            </button>
        </div>

        <dialog id="editDialog">
            <form id="editForm">
                <h2>Edit Task</h2>

                <input
                    id="titleInput"
                    type="text"
                    maxlength="200"
                    autocomplete="off"
                    placeholder="Task title"
                />

                <div class="actions">
                    <button type="button" id="cancel">Cancel</button>

                    <button type="submit" class="primary">Save</button>
                </div>
            </form>
        </dialog>

        <dialog id="folderDialog">
            <form id="folderForm">
                <h2 id="folderDialogTitle">New Folder</h2>

                <input
                    id="folderNameInput"
                    type="text"
                    maxlength="100"
                    autocomplete="off"
                    placeholder="Folder name"
                />

                <div class="actions">
                    <button type="button" id="folderCancel">Cancel</button>

                    <button type="submit" class="primary">Save</button>
                </div>
            </form>
        </dialog>

        <script src="icons.js"></script>
        <script src="app.js"></script>
    </body>
</html>
